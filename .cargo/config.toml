# Build parallelism is capped BELOW the core count on purpose.
#
# This machine has 12 logical cores — 8 performance, 4 efficiency — and cargo's
# default is all of them, which is what makes an interactive session unusable for
# the two to five minutes a `-p app` rebuild takes. COMPILATION dominates the test
# loop here (CLAUDE.md measures 151s after touching `app`, 277s after `zvm`, against
# a 5.8s warm suite), so the machine is saturated for the whole of it, and clippy is
# a full second build with its own fingerprints.
#
# 6 leaves the four efficiency cores AND two performance cores for everything else.
# It is a deliberate trade of some wall-clock for a responsive machine, not a tuning
# guess — and it was lowered from 8 because 8 still made the machine sluggish during
# a rebuild in practice. Measured comfort beats the core count on paper.
#
# CI is exempt: the workflow sets CARGO_BUILD_JOBS, and the environment variable
# wins over this file. A 4-core runner running 8 concurrent rustc processes is
# slower AND risks the memory ceiling on a crate the size of `app`.
# The build directory is `target.noindex`, not `target`, because Spotlight skips
# any directory whose name ends in `.noindex` and indexes everything else — and a
# day of merges writes tens of thousands of files here. Measured 2026-09-02:
# `corespotlightd` at 200% CPU with `mds`/`mds_stores` behind it, and a
# `cargo check --all-targets` after touching `app` at 15–28 minutes against 11
# on a quiet machine (the rest is `app`'s own test module, see CLAUDE.md).
# CI and the Docker build set `CARGO_TARGET_DIR=target`, which wins over this
# file, so every path in the workflows and the Dockerfile stays `target/...`.
[build]
jobs = 6
target-dir = "target.noindex"
