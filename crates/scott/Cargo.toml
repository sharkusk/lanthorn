[package]
name = "lanthorn-scott"
description = "A zero-dependency virtual machine for Scott Adams (ScottFree .dat) format interactive fiction"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["interactive-fiction", "scott-adams", "text-adventure", "emulator"]
categories = ["emulators", "parser-implementations"]
include = ["src/**", "Cargo.toml", "README.md"]

[lib]
# Package renamed for crates.io (SQ-1250); the crate name every `use
# scott::…` in the workspace resolves to stays "scott", and every `-p scott`
# in CI/docs became `-p lanthorn-scott` instead (cargo's `-p` matches package
# name, not this field).
name = "scott"
# No doctests here; skip the rustdoc doctest pass (seconds of harness
# compilation for zero tests). Remove if real doctests are added.
doctest = false

[dependencies]
# The shared answer type both VM crates already return (SQ-1103/SQ-1118) — an
# internal, zero-dependency workspace crate, so this stays a zero-EXTERNAL-
# dependency crate exactly as before.
grammar-model = { package = "lanthorn-grammar-model", path = "../grammar-model", version = "0.4.4" }
