[package]
name = "lanthorn-scott-cli"
description = "A no-map, DOS-style command-line Scott Adams interactive-fiction player"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["interactive-fiction", "scott-adams", "cli", "text-adventure"]
categories = ["command-line-utilities", "games"]
include = ["src/**", "Cargo.toml"]

[[bin]]
# Package renamed for crates.io (SQ-1250 follow-up); the installed binary stays
# "scott-cli" (release.yml's archives and the CLI's own --help/--version name
# it that way).
name = "scott-cli"
path = "src/main.rs"

[dependencies]
buildinfo = { package = "lanthorn-buildinfo", path = "../buildinfo", version = "0.4.3" }
cli-host = { package = "lanthorn-cli-host", path = "../cli-host", version = "0.4.3" }
scott = { package = "lanthorn-scott", path = "../scott", version = "0.4.3" }
crossterm = "0.29"
