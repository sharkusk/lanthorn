[package]
name = "app"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
name = "app"
path = "src/lib.rs"
# No doctests in this crate; skip the rustdoc doctest pass (it costs seconds of
# harness compilation for zero tests). Drop this if real doctests are added.
doctest = false

[[bin]]
name = "lanthorn"
path = "src/main.rs"

# SQ-1242: `app`'s ~3,271 in-crate `#[test]`s (all under `#[cfg(test)] mod tests`
# blocks, one per source file) are gated behind these marker features instead of
# bare `cfg(test)`, so `cargo check -p app --lib --tests` with no features on
# compiles none of them — 33s for `--lib` alone vs 5m19s for `--tests` unguarded
# was the whole reason. Each `t-*` feature names a slice of the module tree; a
# developer can guess the group from the file. Plain markers, no deps. `t-all`
# must list every `t-*` feature — `t_all_lists_every_group` in
# `crates/app/tests/suites/test_feature_gating.rs` fails the build if a group is
# missing from it or if any `#[cfg(test)] mod` in `src/` is left ungated on one
# of these features. Run one group: `cargo nextest run -p app --lib --features
# t-input input`. Run everything (CI does): `--features t-all` or
# `--all-features`.
[features]
t-input = []    # input.rs, keymap, slash(_dispatch), browser, complete, pixel/pane mouse
t-render = []   # render/*, plus the model layer it draws (graphics, layout, fonts, list_scroll, pager, clipboard, cell_dump)
t-picker = []   # picker*, ifdb*, ifiction, ifid, fetch_worker, cover*, story_info/menu/pick/url, launch_options*, metadata_import
t-session = []  # session/glulx_session/scott_session, engine*, probe*, turn, glk_backend, glulx_debug/roomlock, interpreter, inventory, machine_boot, reload, reset, startup
t-guidance = [] # vocab, reveal (word reveal), assist, hints, hint_download
t-persist = []  # archive*, history, storage, config*, styles, aux/vfs/persist stores, garglk_ini, ingame_io, pcset_store
t-theme = []    # theme/*, colors, style, term_colors, period
t-state = []    # state.rs, overlays, debug_panel, mapper glue (map_dump, roomid, export*, tidy, symbols)
t-misc = []     # everything with no closer home: anim, assets, docs_reference, lifecycle, loop_tick, main, native_sound, notify, query_sweep, stderr_redirect, terminal_dump, trace, watch, corpus, lib.rs's own palette-guard self-test
t-all = ["t-input", "t-render", "t-picker", "t-session", "t-guidance", "t-persist", "t-theme", "t-state", "t-misc"]

[dependencies]
buildinfo = { path = "../buildinfo" }
# SQ-0850: the per-game save-directory key and the canonical-title table the
# readable half of it comes from. Shared with `zvm-cli` so the TUI and the CLI
# cannot name one game's save directory two different ways.
cli-host = { path = "../cli-host" }
zvm = { path = "../zvm" }
gvm = { path = "../gvm" }
scott = { path = "../scott" }
# SQ-1041: the shape of what a story's parser accepts, produced by both grammar
# readers, so the vocabulary offer is one piece of code for every engine.
grammar-model = { path = "../grammar-model" }
# SQ-1119: the one thing a story file cannot answer — that `illuminate` means
# `light`. A shipped table, parsed lazily behind a `OnceLock` on the first
# rejected word, so a session that never has one never reads it.
verb-synonyms = { path = "../verb-synonyms" }
mapper = { path = "../mapper" }
blorb = { path = "../blorb" }
audio = { path = "../audio" }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
ratatui-image = { version = "11.0.6", default-features = false }
# gif: IFDB and the IFComp archive serve some covers as GIF; without the
# decoder those fetches were dropped as "does not decode" (13 of 29 in one
# curated import, two of them IFDB's own).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
# `wrap_help` reflows long help to the real terminal width. Without it clap does
# not wrap AT ALL — it joins a doc comment into one paragraph and prints it — so
# every long option ran off the edge and only the ones carrying
# `verbatim_doc_comment` looked right, because those keep the source's own line
# breaks rather than being wrapped.
clap = { version = "4", features = ["derive", "wrap_help"] }
notify = "6"
unicode-width = "0.1"
unicode-segmentation = "1"
signal-hook = "0.3"
jiff = "0.2"
roxmltree = "0.21"
ureq = "3.3"
hyperrat = "0.1.3"
font8x8 = "0.3"
# SQ-0976: zlib for the kitty graphics protocol's `o=z` payload compression.
# Already in the graph three times over (png, ureq, zip), so naming it here
# compiles nothing new.
flate2 = "1"

# SQ-0764: a SECOND opinion on the bytes lanthorn emits. The pty harness
# (SQ-0762) decodes the stream with our own hand-rolled decoder, which is
# exactly as likely to be wrong as the code it is auditing. `qwertty-term-vt` is
# Ghostty's terminal core ported to Rust — a real emulator's resolution of the
# same bytes, so "an image covers these cells" versus "a background colour was
# painted into these cells" has an independent witness. TESTS ONLY: the shipped
# binary must never gain it (`cargo tree -p app -e normal | grep -c qwertty`
# must print 0).
[dev-dependencies]
# SQ-0942: a real typeface for the gallery tool (`--example gallery`), whose
# output is meant to be LOOKED at. It is NOT used by the geometry oracle, which
# keeps its deliberately-synthetic bitmap face — see
# `tests/pty_stream/gallery.rs` for why giving that one a real font would be
# actively harmful. TESTS ONLY, like the line below it.
fontdue = "0.9"
qwertty-term-vt = "0.4.0"

# SQ-0586: fd-level stderr redirect. C libraries (libasound via rodio/cpal) write
# to fd 2 directly, so nothing in Rust can intercept them — only dup2 can.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
