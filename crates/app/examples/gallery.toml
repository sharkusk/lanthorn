# The lanthorn gallery (SQ-0942) — the RECIPE for the project page's stills.
#
# `cargo run -p lanthorn --example gallery` regenerates every frame below from the
# real binary, into `target/gallery/`. The pictures are output and are not
# committed; this file is, because it is the thing that gets them back.
#
# What a shot may NOT say here: the release, the serial, or the turn count. The
# first two are read out of the header of the bytes the medium actually mounted,
# and the third is counted off `keys`. A hand-written provenance line is a second
# copy of the truth, and this repository has been bitten by one.
#
# `expect` is required, and it is the field that keeps the rest honest. Every
# number a shot records — release, serial, medium — comes from the FILE, so all
# of them go on being correct while the frame shows something else entirely. The
# first draft of this manifest pointed a Zork Zero shot at a DOS floppy that
# lanthorn opens a browser for, and two blank keypresses picked *Ballyhoo* off a
# neighbouring disk under a caption about Zork Zero's border art. `expect` names
# something that must be on the resolved screen, and it caught that.
#
# `expect` NAMES A STRING, WHICH IS NOT THE SAME AS NAMING A SUBJECT (SQ-1164).
# All five Journey shots drove `n` and three blank returns, which halts at
# Journey's opening MENU: the illustration on the left, an EMPTY text pane on the
# right, and *Start · Background · Change Name · Help · Game* along the bottom.
# Both strings those shots named — "The Party", "Individual Commands" — are
# headings on that menu, so five frames captioned about prose passed a guard while
# showing none of it, and it took a human eye on a proof sheet to notice. A shot
# whose subject is the STORY PANE therefore also sets `expect_prose_cells`: the
# least number of cells INSIDE the pane that carry a letter or a digit the game
# wrote. Inside the pane because lanthorn's own header and help bar are a
# hundred-odd letters that are there whatever the game did, so a screen-wide count
# cannot fail. Measured on `journey-blorb`: menu 59, title splash 170, intro card
# 350, in play 517.
#
# `backend` chooses the cell size too (kitty 16x32, half-blocks 10x20), because
# the half-block picker uses its own 10x20 font whatever the terminal reports and
# a capture at any other cell size draws a geometry lanthorn was not using. Both
# cells are exactly 1:2, which is what makes a half-block sample square.
#
# `args` is passed to lanthorn as typed, minus the arguments the tool owns —
# `--image-protocol`, `--user-dir`, `--sound` and `--v6-pixel-lock`, each of which
# the harness sets for every shot so that no single frame can disagree with the
# rest of the set.
# `--pictures NAME` is the interesting one and the reason Zork Zero has six rows
# below: it names WHICH rendition of the artwork to draw, and the archive's own
# flavour then picks the machine. The harness reads that name back out of `args`
# so the provenance under the frame describes the screen the shot actually booted
# — the Macintosh's monochrome plates lay out on 480x300 where its colour ones
# are 320x200 doubled, and a magnification computed off the wrong one is wrong
# and self-consistent (SQ-1001).
#
# ── `size` IS A MAGNIFICATION, NOT A TASTE (SQ-0963) ─────────────────────────
#
# A v6 press lays itself out on a fixed native screen — 640x400 for most media in
# this manifest — and lanthorn letterboxes that into the story pane at
# `min(box_w / native_w, box_h / native_h)`, unrounded. The composite is resized
# ONCE to `round(native * s)` and every band is a 1:1 crop out of it, so `s` is
# the only place softness can enter a frame: at a whole `s` one art pixel lands on
# a whole number of device pixels and the picture is exactly as crisp as the
# artwork; at anything else every edge in it is interpolated. The first draft of
# this file was 117x40 throughout, which is 1.4375x, and it showed.
#
# The story pane's content is `COLS - 2` by `ROWS - 3` cells (one row for the help
# bar, one cell of border on every side), so with a 640x400 press:
#
#   kitty, 16x32 cell       s = min((COLS-2)/40, (ROWS-3)/12.5)
#     2x  82x28      3x  122x41     4x  162x53
#   half-blocks, 10x20 cell s = min((COLS-2)/64, (ROWS-3)/20)
#     1x  66x23      2x  130x43
#
# `every_v6_shot_magnifies_by_a_whole_number` recomputes this over the committed
# file and fails if a size drifts off it, and the gallery tool prints the
# magnification it measured under every frame.
#
# This is per-shot arithmetic and cannot become one constant: presses differ in
# native size (Arthur's Apple II press is 560x384, the Macintosh's monochrome
# plates are 480x300 — which is why `zork0-mac-mono` is 92 columns and nothing
# else is, and why `zork0-mac-tall` is 62), so a size that is integral for one is
# fractional for the next. The native screen is DERIVED at capture time from the
# mounted medium, never declared here.
#
# ── AND WHY THE KITTY GRIDS HALVED (SQ-1001) ─────────────────────────────────
#
# Every kitty shot used to be 162x53 on an 8x16 cell, and the type in them was
# half the size the game laid out. A v6 press draws its text on an 8x16 GAME-pixel
# cell; hybrid mode gives each of those characters one TERMINAL cell; the art
# beside it is magnified by `s`. So the terminal cell that matches the art is
# `8s x 16s`, and at `s = 2` that is 16x32 — the cell every kitty shot is now
# captured at, with the grid halved to hold the same box. The frames are the same
# device size and the same magnification; the prose in them is twice as big and
# sits in its own boxes the way the artist drew it.
#
# The rung that went is 1x. At `s = 1` a 16x32 cell would give the game's own
# 80-column screen 40 cells to lay out in, and its text overruns its windows —
# measured on Journey at 42x16, where "Individual Commands" came out "Individual
# Comman". So a kitty shot magnifies by at least 2, and the pane-size row now runs
# 2x / 3x / 4x. It shows exactly what it showed before: one artwork at three
# resolutions, none of them a resampled version of another.
#
# The half-block row keeps its 10x20 cell and its small type, and that is not an
# oversight: `Picker::halfblocks()` hardcodes 10x20 whatever the terminal reports,
# so capturing at any other cell would draw a geometry lanthorn was not using. Its
# type is the size a reader without a graphics protocol actually gets.
#
# The media directories (`stories/`, `treasures/`, `masterpieces/`) are
# gitignored, so this cannot run anywhere they are absent. A missing medium is a
# reported failure rather than a silent skip.

# ── Journey: the picture region that is its own window ───────────────────────
#
# The pair that taught this repository that a disk image is a different BUILD.
# The bare story is release 83; the Amiga floppy is release 30, and the two
# narrate through different windows. Both are here for that reason.
#
# HOW YOU GET INTO JOURNEY, since it is the one game in this file with no typed
# parser prompt and `text:look` is therefore not the answer (SQ-1164). Five
# keypresses, and every one of them does something different:
#
#   n     answers the GAME's "Do you want to restore a saved game?", which it asks
#         before its story starts (Arthur's press does the same)
#   cr    dismisses the full-screen title splash
#   cr    turns the credits card ("Created by Marc Blank")
#   cr    turns the "It was a Golden Age" prologue, which lands on the OPENING
#         MENU — Start · Background · Change Name · Help · Game — with the story
#         pane still empty
#   cr    takes Start, the item the menu opens on, and the game begins narrating
#
# The fifth is the one the five Journey shots were missing for their whole life.
# The frame all five reach is the party in front of the provisioner at Lavos,
# with the in-play command menu (Proceed · Enter, the four characters, Get Advice
# · Cast · Examine · Drop · Inventory) under the prose.

[[shots]]
id = "journey-blorb"
title = "Journey"
press = "story file with the Blorb archive beside it"
media = "stories/journey-r83-s890706.z6"
caption = """
Journey's illustration is not a picture pasted over the text: it is a window the \
game reserves and paints into, with the prose and the party menu laid out around \
it. lanthorn keeps the art as kitty graphics and the text as terminal cells, so \
the two share a boundary without either being resampled."""
keys = "wait:2500,n,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:2000"
size = "82x28"
expect = ["The Party", "Individual Commands"]
expect_art_cells = 150
# Both `expect` strings above are headings on the OPENING MENU, so they cannot
# tell an empty story pane from a full one — this is the guard that can. 517
# letters measured in play; the menu frame that shipped for months scores 59, the
# title splash 170 and the intro card 350, so 400 fails all three with room.
expect_prose_cells = 400

[[shots]]
id = "journey-amiga"
title = "Journey"
press = "Amiga release floppy (.adf)"
media = "stories/Journey - The Quest Begins.adf"
caption = """
The same game off its own Amiga release disk — a different build from the story \
file above, with the Amiga's palette and its own idea of which window the \
narration goes through. lanthorn reads the medium and dresses the screen as that \
machine did."""
keys = "wait:2500,n,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:2000"
size = "82x28"
expect = ["The Party", "Individual Commands"]
# 524 measured — release 30 wraps the same scene a little differently from r83's
# 517, which is one more way the two builds are not the same game.
expect_prose_cells = 400

# ── Zork Zero: six renditions of one scene ───────────────────────────────────
#
# THE POINT OF THIS ROW IS THAT THE FRAMES DIFFER (SQ-1001). It used to be four,
# and every one of them drew the MCGA plates: the Blorb wraps them, the 720K DOS
# floppy carries `ZORK0.MG1` and nothing else, and the Amiga's and the Macintosh's
# COLOUR art is close enough to MCGA at a glance that a reader saw one picture
# four times over. What Zork Zero actually shipped as is five video cards, and
# those differences are not subtle at all — CGA is two colours, EGA dithers
# sixteen, the Macintosh's second archive is black and white.
#
# Which rendition each row draws, and where it comes from:
#
#   zork0-blorb     Zork0.blb beside the story        MCGA, 256 colours
#   zork0-dos       720K DOS floppy, disk 1           MCGA — the only art on it
#   zork0-dos-cga   360K DOS floppy, disk 1           CGA, two colours
#   zork0-dos-ega   360K DOS floppy, disk 2           EGA, off disk 3 of that box
#   zork0-amiga     Amiga floppy                      the Amiga's own plates
#   zork0-mac-mono  Macintosh floppy, --pictures      Pic.data, monochrome
#
# NOT here, and it is the one that was cut rather than the one that was never
# tried: the Macintosh's COLOUR archive, `CPic.data`, which is what that disk
# hands back on its own. It was captured and it is a fifth brown frame — the same
# picture as the Blorb, the 720K floppy and the Amiga. Its release (296, October
# 1988) and its machine are worth showing, so `zork0-mac-mono` carries them, off
# the same disk.
#
# The first key is not for the game. lanthorn raises a notice on the opening
# frame and the next key dismisses it rather than reaching the parser, so
# `text:look` on its own typed "ook" and every one of these frames used to carry
# `[I don't know the word "ook."]` under its artwork. Measured 2026-08-21.

