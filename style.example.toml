# ── The 11 Glk styles for text-buffer windows (base: text).
[glk.buffer]
# normal = { parent = "text" }
# emphasized = { parent = "text", italic = true }
# preformatted = { parent = "text" }
# header = { parent = "heading", bold = true }
# subheader = { parent = "heading", bold = true }
# alert = { parent = "alert", bold = true }
# note = { parent = "muted", italic = true }
# blockquote = { parent = "muted" }
# input = { parent = "accent" }
# user1 = { parent = "text" }
# user2 = { parent = "text" }

# ── The 11 Glk styles for text-grid windows (base: chrome).
[glk.grid]
# normal = { parent = "chrome" }
# emphasized = { parent = "chrome", italic = true }
# preformatted = { parent = "chrome" }
# header = { parent = "heading", bold = true }
# subheader = { parent = "heading", bold = true }
# alert = { parent = "alert", bold = true }
# note = { parent = "muted", italic = true }
# blockquote = { parent = "muted" }
# input = { parent = "accent" }
# user1 = { parent = "chrome" }
# user2 = { parent = "chrome" }
# background = { parent = "chrome", reversed = true }

# ── Map colours + glyph-set presets.
[map]
# background = {}
# room = { parent = "text" }
# room_current = { parent = "accent" }
# room_selected = { parent = "accent", reversed = true }
# room_alias_marker = { parent = "muted" }
# connector = { parent = "accent" }
# connector_distorted = { fg = "magenta" }
# connector_portal = { parent = "accent" }
# shared_path = { fg = "light-cyan" }
# loc_indicator = { parent = "muted" }
# "matrix.header" = { parent = "heading" }
# "matrix.row:here" = { parent = "accent", reversed = true }
# "matrix.row:selected" = { parent = "accent" }
# "matrix.cell:entrance" = { parent = "text", bold = true }
# "matrix.cell:path" = { parent = "accent", bold = true, underline = true }
# "matrix.cell:frontier" = { parent = "muted" }
# "matrix.cell:random" = { parent = "alert" }
# "matrix.footnote" = { parent = "muted" }
# "edge:oneway" = { parent = "map.connector" }
# "edge:asym" = { parent = "map.connector" }
# trail = { parent = "muted" }
# box_style = "rounded"   # rounded | thick | double | solid | super-thick | ascii | borderless
# arrow_set = "filled"   # filled | line | nerdfont | nf-bold | nf-box | nf-chevron | nf-circle | nf-outline
# portal_icons = "ascii"   # ascii | nerdfont | nerdfont-stairs
# path_style = "light"   # light | heavy | dotted
# portal_path_style = "dotted"   # light | heavy | dotted
# control_icons = "plain"   # plain | nerdfont   (every border control: both panes' clusters and the tooltip pointer)
# diagonal_corners = true   # false = plain orthogonal corner exits, for fonts without Unicode 13 (🮠🮡🮢🮣)

# ── One glyph at a time. An override beats the preset above it, so you can keep ─
# ── a whole preset and change only the one corner you dislike. Values must be ───
# ── exactly ONE narrow character; anything else is ignored. ─────────────────────
[map.overrides]
# "room.normal.tl" = "┌"     # room box corners/edges: room.<normal|current|selected|portal>.<tl|tr|bl|br|h|v>
# "arrow.north" = "▲"        # connector arrowheads: arrow.<north|south|east|west|ne|nw|se|sw>
# "path.ns" = "│"            # connector lines: path.<ns|ew|ne|nw|se|sw|nse|nsw|ews|ewn|cross>
# "path.diag_ul" = "🮠"       # the four half-diagonals: path.<diag_ul|diag_ur|diag_ll|diag_lr>
# "portal.up" = "↑"          # portal markers: portal.<up|down|in|out|marker|path|unknown>
# "gutter.meta" = "▏"        # transcript gutter marks: gutter.<meta|warning|assist>
# "gutter.assist" = "●"      # the mark of Lanthorn's Guiding Light (a patched font's lamp: U+F1A60)
# "control.map_hide" = "▶"   # border toggles: control.<map_show|map_hide|band_show|band_hide|inventory_open>
# "control.guidance_on" = "●" # …control.<guidance_on|guidance_off>
# "control.lock_on" = "▣"    # …control.<render_hybrid|render_raster|render_extended|lock_on|lock_off>
# "map_control.centre" = "¤" # map border cluster: map_control.<room_numbers_on|room_numbers_off|centre|zoom_out|zoom_in|view_matrix|view_drawn>
# "map_control.view_drawn" = "M" # the plain set repeats one mark per pair (# #, M M) and lets colour say which
#                            # state you are in; set the _off/_drawn half for a SHAPE change instead. On a
#                            # patched font that is md-numeric_off (U+F19D3) and md-grid_off (U+F02C2).

# ── Debug inspector disassembly selectors.
[debug]
# pc = { parent = "accent", reversed = true }
# disasm_executed = { parent = "accent", fg = "blue", glyph = "|" }
# disasm_rd = { parent = "text", fg = "yellow", glyph = " " }
# disasm_soft = { parent = "muted", fg = "red", glyph = " " }
# disasm_data = { parent = "muted", italic = true, glyph = " " }
# zstring = { parent = "accent", italic = true }

# ═══ SURFACES — bordered boxes: a background + frame + the text drawn on them ═══

# ── Panel: the tiled panes (story/map/verb/debug frames) — background,
# border, title, tabs. Story/Glk windows use [glk.*], not this section.
[panel]
# background = {}
# border = { parent = "line", style = "single" }   # style: none | single | double | thick | rounded
# "border:active" = { parent = "line", bold = true, style = "single" }   # style: none | single | double | thick | rounded
# title = { parent = "heading" }
# tab = { parent = "muted" }
# "tab:active" = { parent = "accent", bold = true }
# tab_divider = { parent = "line", glyph = "│" }
# terminator_left = { parent = "line", glyph = "┤" }
# terminator_right = { parent = "line", glyph = "├" }
# control = { parent = "muted" }
# "control:lit" = { parent = "alert", bold = true }
# "control:hover" = { parent = "accent", reversed = true }

# ── Dialog: modal pop-ups — background, its own border, title, buttons, shadow.
[dialog]
# background = { parent = "chrome" }
# border = { parent = "line", bold = true, style = "single" }   # style: none | single | double | thick | rounded
# title = { parent = "accent" }
# button = { parent = "chrome", reversed = true }
# "button:active" = { parent = "accent", reversed = true }
# shadow = { parent = "muted", bg = "dark-gray" }
# list_selected = { fg = "black", bg = "cyan", bold = true }
# list_footer = { parent = "muted" }
# list_header = { parent = "text", underline = true }
# hint_suggestion = { parent = "alert", dim = true }
# launch_caveat = { parent = "alert" }
# "region_prompt.body" = { parent = "dialog.background" }
# "region_prompt.rooms" = { parent = "dialog.list_footer" }
# "region_prompt.room" = { parent = "dialog.region_prompt.rooms" }
# "region_prompt.option" = { parent = "dialog.background" }
# "region_prompt.option:chosen" = { parent = "dialog.list_selected" }
# "font_check.sample" = { parent = "dialog.background" }
# "story_menu.border" = { parent = "dialog.border" }
# "story_menu.item" = { parent = "dialog.background" }
# "story_menu.item:selected" = { parent = "dialog.list_selected" }
# "story_menu.key" = { parent = "dialog.list_footer" }

# ── Tooltip: hover pop-ups — background and an optional border.
[tooltip]
# background = { parent = "dialog.list_selected", bold = false }
# border = { parent = "line", style = "none" }   # style: none | single | double | thick | rounded

# ── Story-line styling rules: recolour whole transcript lines matching a ────
# ── regex. Rules are tried in order; the first match wins. ──────────────────
# [[transcript.rule]]
# match = "^>.*"                 # your echoed command lines → magenta bold
# fg = "magenta"
# bold = true

# [[transcript.rule]]
# match = "(?i)\\bgrue\\b"       # any line mentioning a "grue" → red (flavour example)
# fg = "red"

# ── Status bar. Omit [statusbar] for the built-in default. ───────────────────
# Placeholders: {location} {score} {moves} {time} {turns} {title} {filter}
# NB: this is lanthorn's OWN bar, and `border` frames that. The frame round a
# GAME's status/upper window is the upper_window_border line up in [elements].
# [statusbar]
# border = "none"

# [[statusbar.segment]]
# text  = "{location}"
# align = "left"
# parent = "accent"              # segments may reference a role or set fg/bg directly
# bold  = true

# [[statusbar.segment]]
# text  = "Score: {score}  Moves: {moves}"
# align = "right"

# [[statusbar.segment]]
# text  = "{time}"
# align = "right"
