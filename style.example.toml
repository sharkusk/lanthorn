# lanthorn style.toml — auto-seeded. The section headers below are active,
# but every value line is commented out, so the file stays a no-op until you
# uncomment lines: each commented value already equals the built-in default,
# reconstructed straight from the style registry. Edit, uncomment, save, then
# run reload-style in-app to apply changes live (or turn on config.toml's
# watch_style to auto-reload on save).
#
# Color values accept: a named color (cyan, dark-gray, light-blue, …),
# palette:N (0-15 from the active scheme), #rrggbb hex, a 256-index ("17"),
# or background / foreground (the scheme's bg/fg).

version = 1   # style schema version — do not remove; lets lanthorn flag an out-of-date file

# scheme = "tomorrow-night"   # optional base: built-in name or a Ghostty theme path; omit for terminal colours

# ── Roles: the 7 roots everything else derives from.
[roles]
# text    = { fg = "foreground" }                     # body ink on the page (scheme foreground)
# chrome  = { fg = "foreground", bg = "background" }  # ink on a UI surface: bars, panels, upper window
# line    = { fg = "palette:6" }                      # lines, frames, rules, dividers (scheme cyan slot)
# accent  = { fg = "palette:6" }                      # highlights: links, selection, current room, badges
# muted   = { fg = "palette:8" }                      # dim / secondary text (scheme bright-black slot)
# alert   = { fg = "palette:3" }                      # warnings and errors (scheme yellow slot)
# heading = { fg = "foreground", bold = true }        # titles and headers (bold)

# ═══ TEXT — foreground colour + emphasis (these selectors have no surface of their own) ═══

# ── Elements: app text + host surfaces (status/help bars, upper window,
