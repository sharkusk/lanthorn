[workspace]
members = ["crates/grammar-model", "crates/zvm", "crates/zvm-cli", "crates/mapper", "crates/app", "crates/blorb", "crates/gvm", "crates/gvm-cli", "crates/audio", "crates/scott", "crates/scott-cli", "crates/buildinfo", "crates/cli-host", "crates/verb-synonyms", "crates/verb-synonyms-gen", "crates/audio-relay"]
# Standalone UCD table generator — run by hand only when the pinned Unicode
# version bumps; its output is committed so gvm stays zero-dep.
exclude = ["crates/gvm/tables-gen"]
resolver = "2"

# Shared package metadata inherited by each crate via `<field>.workspace = true`.
# Bump `version` here to version every crate (and the binaries' --version) at once.
[workspace.package]
version = "0.3.0"
license = "BSD-3-Clause"

# SQ-0764: the emitted-stream oracle's dependency, with its own debug assertions
# off. `qwertty-term-vt` 0.4.0's kitty transmit path trips
# `debug_assert!(!load.more)` (src/kitty/exec.rs:208) on a chunked
# transmit-and-display: it hands back the deferred display on EVERY intermediate
# `m=1` chunk instead of only the last. lanthorn chunks every upload at 3072
# bytes, so replaying any real capture hits it on the second chunk. With the
# assertion compiled out the port behaves as it does in release — the premature
# display finds no stored image and is refused, and the final chunk places the
# image correctly — which is the behaviour the oracle needs. Test-profile only;
# the crate is a dev-dependency and never reaches the shipped binary.
[profile.dev.package.qwertty-term-vt]
debug-assertions = false

# Line-tables-only debug info: keeps panic backtraces with file/line, but drops
# the variable-inspection DWARF that bloats debug/test binaries to ~45 MB each
# and makes every relink slow. Test builds inherit this from [profile.dev].
# Remove (or raise to `debug = true`) if you need full lldb variable inspection.
[profile.dev]
debug = "line-tables-only"

# SQ-0972: ratatui-image 11.0.6's halfblocks encoder allocates its cell buffer
# with `(size.width * size.height) as usize` — a u16 multiply, which WRAPS — and
# then indexes it with `x + (size.width as usize) * (y / 2)`, in usize, which
# does not. Below 65535 cells the two agree exactly; one cell past it the buffer
# is allocated modulo 65536 while the loop walks the true extent, and the encode
# panics. A 460x147 terminal gives the game pane 458x144 = 65952 cells, which
# allocated as 416 and died at index 416.
#
# Half-blocks is the backend that reaches this first, because its resolution IS
# the cell grid — SQ-0964 removed the 2x magnification cap there precisely so a
# smaller font would buy a sharper picture, which walks straight into the
# ceiling. Seven more of the same shape in `cells * font_size` (src/lib.rs,
# src/sliced.rs) do not panic; they silently compute a wrapped pixel dimension.
#
# The branch is the v11.0.6 release commit — deliberately NOT master, which
# carries an unrelated change to font-size detection (ioctl + env hints), the
# very input this geometry is derived from.
# Upstream PR for the wrap: https://github.com/ratatui/ratatui-image/pull/189
#
# It has since grown three more additions, each one method or one variant, and
# each one a thing the crate cannot express and lanthorn cannot work around:
#
#   * `Picker::set_font_size` (SQ-0992) — a mid-session font change must not
#     rebuild the picker, which would drop the queried capability list.
#   * `Capability::KittyCompression` + `o=z` transmits (SQ-0991) — probe the
#     terminal before deflating, because a transmit it cannot inflate is
#     invisible rather than slow.
#   * `Picker::new_protocol_with_id` and a NAMED virtual placement (`p=1`,
#     SQ-0996) — a kitty placement writes its image id into every cell it
#     covers, so re-encoding changed art under a freshly drawn random id
#     repaints the whole rect. The caller is the only one who knows two encodes
#     are the same thing changing.
#
# REMOVE THIS once a release carrying all of them exists: delete the stanza and
# bump the version in crates/app/Cargo.toml.
[patch.crates-io]
ratatui-image = { git = "https://github.com/sharkusk/ratatui-image", branch = "lanthorn-11.0.6-u16-fix" }
