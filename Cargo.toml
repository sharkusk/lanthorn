[workspace]
members = ["crates/grammar-model", "crates/zvm", "crates/zvm-cli", "crates/mapper", "crates/app", "crates/blorb", "crates/gvm", "crates/gvm-cli", "crates/audio", "crates/scott", "crates/scott-cli", "crates/buildinfo", "crates/cli-host", "crates/verb-synonyms", "crates/verb-synonyms-gen", "crates/audio-relay"]
# Standalone UCD table generator — run by hand only when the pinned Unicode
# version bumps; its output is committed so gvm stays zero-dep.
exclude = ["crates/gvm/tables-gen"]
resolver = "2"

# Shared package metadata inherited by each crate via `<field>.workspace = true`.
# Bump `version` here to version every crate (and the binaries' --version) at once.
[workspace.package]
version = "0.5.3"
license = "BSD-3-Clause"
repository = "https://github.com/sharkusk/lanthorn"
homepage = "https://github.com/sharkusk/lanthorn"
# The toolchain `rust-toolchain.toml` pins for the clippy gate (see its own
# comment) is also what CI's `dtolnay/rust-toolchain@stable` step builds
# against, since rustup reads that file for every invocation including CI's —
# so 1.98 is proven, not merely intended.
rust-version = "1.98"

# Line-tables-only debug info: keeps panic backtraces with file/line, but drops
# the variable-inspection DWARF that bloats debug/test binaries to ~45 MB each
# and makes every relink slow. Test builds inherit this from [profile.dev].
# Remove (or raise to `debug = true`) if you need full lldb variable inspection.
[profile.dev]
debug = "line-tables-only"

# `lanthorn-shm` on the fork: upstream master (v11.0.8) plus the three things
# lanthorn needs that no release carries yet. Master itself already holds two of
# ours — the u16 wrap fix (PR 189) and kitty `o=z` compression detection
# (PR 190) — so the pin is no longer about them; it exists for what is still in
# review:
#
#   * kitty shared memory transmission, `t=s` (upstream PR 198, benjajaja's) —
#     the pixels are handed over in a POSIX shared memory object instead of
#     base64'd into the terminal's input stream. Worth roughly a megabyte a
#     frame on a v6 raster composite.
#   * two platform fixes to it (ours): a shared memory name over 31 bytes is
#     refused on macOS (`PSHMNAMLEN`), and `write(2)` on a shared memory object
#     answers `ENXIO` there — so `t=s` transmitted nothing at all on the
#     platform this is mostly developed on.
#   * `Capability::KittySharedMemory` and `kitty_shared_memory_probe` (ours,
#     PR onto 198) — ASK the terminal before handing it an object it may not be
#     able to open. Same shape and same reason as the `o=z` probe: a terminal
#     on the other end of an ssh connection cannot open our shared memory, and
#     a transmission it refuses is invisible rather than slow.
#
# Two earlier additions on the same branch, still unreleased:
#
#   * `Picker::set_font_size` (SQ-0992) — a mid-session font change must not
#     rebuild the picker, which would drop the queried capability list.
#   * `Picker::new_protocol_with_id` and a NAMED virtual placement (`p=1`,
#     SQ-0996) — a kitty placement writes its image id into every cell it
#     covers, so re-encoding changed art under a freshly drawn random id
#     repaints the whole rect. The caller is the only one who knows two encodes
#     are the same thing changing.
#
# REMOVE THIS once a release carrying all of them exists: delete the stanza and
# bump the version in crates/app/Cargo.toml.
[patch.crates-io]
ratatui-image = { git = "https://github.com/sharkusk/ratatui-image", branch = "lanthorn-shm" }

# SQ-0774: the emitted-stream oracle's dependency (`crates/app/tests/pty_stream/oracle.rs`,
# dev-dependency only), on a fork carrying our fix for
# https://github.com/joshka/qwertty-term/issues/327 — `qwertty-term-vt` 0.4.0's
# kitty transmit path hands back the deferred `display` on EVERY intermediate
# chunk of a chunked transmit-and-display (`a=T,m=1`) instead of only the last,
# tripping `debug_assert!(!load.more)` (src/kitty/exec.rs:208) as soon as a
# transfer needs more than two chunks — which every real capture does, since
# lanthorn chunks uploads at 3072 bytes. Release behaviour was already correct;
# only the assertion was wrong. `lanthorn-0.4.0-chunked-fix` branches from the
# crate's own 0.4.0 tag with just that one fix, so this patch changes nothing
# else about the pinned version. REMOVE THIS once a qwertty-term-vt release past
# 0.4.0 carries the fix: delete the stanza and let the plain crates-io version
# resolve again.
qwertty-term-vt = { git = "https://github.com/sharkusk/qwertty-term", branch = "lanthorn-0.4.0-chunked-fix" }
