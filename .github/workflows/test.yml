name: Test

# The push/PR gate this repo was missing — release.yml only builds on `v*`
# tags. This runs the workspace test suite (+ clippy, one platform) on every
# push to main and every pull request.

# Prose is not code: a push that touches only the README, the changelog or the
# docs tree (its PNGs included) builds nothing and gets no run. The one thing
# this forgoes is the link check in `docs_reference`, which is cheap to run
# locally (`cargo nextest run -p app docs_reference`) when a doc change adds a
# link. A push that mixes prose with Rust still runs in full.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'machine-screenshots/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'machine-screenshots/**'

# A new run cancels an in-progress one for the same ref — e.g. re-pushing to a
# PR branch. Distinct refs (different PRs, or PR vs. main) get their own
# group, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Linux audio (ALSA) is a build-time dependency of the default feature
      # set (audio's default features pull in rodio) — same requirement as
      # release.yml's Linux leg.
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      # `.cargo/config.toml` caps build parallelism at 8 so a rebuild leaves the
      # DEVELOPER's 12-core machine usable while it runs. A runner has 3-4 cores,
      # where eight concurrent rustc processes are slower AND put a crate the size
      # of `app` near the memory ceiling — so give the runner its own core count
      # back. The environment variable wins over the config file, and `getconf`
      # answers on all three of Linux, macOS and Git-bash.
      - name: Un-cap build jobs for the runner
        shell: bash
        run: |
          # `nproc` on Linux, `getconf` on macOS, either on Git-bash. If neither
          # answers, say nothing: cargo then falls back to the config file's 8,
          # which is merely suboptimal — this step must not be able to fail CI.
          n=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || true)
          case "$n" in ''|*[!0-9]*) echo "core count unavailable; leaving jobs capped" ;;
                       *) echo "CARGO_BUILD_JOBS=$n" >> "$GITHUB_ENV" ;; esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # `--locked` requires Cargo.lock to be committed and in sync with
      # Cargo.toml (it is) — this also guards against drift on Windows, where
      # a regenerated lockfile can differ in ways CI shouldn't silently accept.
      #
      # Story-fixture-gated tests (real commercial games under the gitignored
      # `stories/` dir) skip themselves cleanly when that directory/file is
      # absent — which it always is in CI. Small fixtures actually needed by
      # the suite (czech.z5, minizork.z3, tiny_cave.dat, glulxercise.ulx, etc.)
      # are committed under each crate's `tests/fixtures/` and are present.
      # SQ-1242: `app`'s in-crate unit tests sit behind `t-*` Cargo features
      # (crates/app/Cargo.toml) so a plain `cargo test` no longer compiles or
      # runs them — `--all-features` is what turns every `t-*` group (via
      # `t-all`) back on, for `app` and harmlessly for every other crate.
      - name: cargo test
        run: cargo test --workspace --locked --all-features

      # One job, Linux only — clippy's result doesn't vary meaningfully by OS
      # for this codebase, so running it 3x would just burn minutes.
      # `--all-features` for the same SQ-1242 reason as the test step above.
      - name: cargo clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # NOTE: no `cargo fmt --check` step. The existing codebase isn't
      # rustfmt-clean (verified locally: `cargo fmt --check` reports diffs
      # across many pre-existing files), so adding the check now would fail
      # on unrelated code rather than catch new drift. Revisit once the tree
      # is formatted.
