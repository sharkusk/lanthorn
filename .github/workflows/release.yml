name: Release

# Cut a release by pushing a version tag:   git tag v0.2.0 && git push origin v0.2.0
# A `-rc.N` suffix (e.g. v0.2.0-rc.1) marks the release as a pre-release.
# The GitHub Release is created as a DRAFT — review the attached binaries, then
# hit Publish. Run the workflow manually (Actions -> Release -> Run workflow) for
# a dry run: it builds every platform and uploads the archives as run artifacts
# WITHOUT creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# A new run cancels an in-progress one for the same ref — e.g. repeated dry-runs
# on main, or re-pushing a tag. Distinct tags get their own group, so two real
# releases never cancel each other. (Drop the `-${{ github.ref }}` to make it a
# single global lane where any new run cancels any in-progress run.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `.cargo/config.toml` builds into `target.noindex` (a Spotlight exclusion that
# only matters on a developer's Mac); the environment variable wins over it, so
# every `target/...` path below keeps working.
env:
  CARGO_TARGET_DIR: target

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04                 # older glibc for broader compatibility
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-universal2
            os: macos-latest                 # arm64 runner; also cross-builds x86_64
            target: universal-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      # Only on a real tag push: between releases README.md carries these tags by
      # design, and a workflow_dispatch dry run exists to exercise the BUILDS.
      - name: No unreleased-feature tags may ship in a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if grep -n -i 'next release' README.md; then
            echo '::error::README.md still carries "Next release" tags; drain them before tagging'; exit 1; fi
          if grep -n '^## Unreleased' CHANGELOG.md; then
            echo '::error::CHANGELOG.md still has an Unreleased section; name the version before tagging'; exit 1; fi

      # Linux audio (ALSA) is a build- and run-time dependency of the default
      # feature set. Release binaries link libasound and require libasound2 at
      # runtime (documented in the release notes).
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      # Same as test.yml: `.cargo/config.toml` caps build jobs at 8 for the
      # developer's machine, and a runner should use its own core count.
      - name: Un-cap build jobs for the runner
        shell: bash
        run: |
          # `nproc` on Linux, `getconf` on macOS, either on Git-bash. If neither
          # answers, say nothing: cargo then falls back to the config file's 8,
          # which is merely suboptimal — this step must not be able to fail CI.
          n=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || true)
          case "$n" in ''|*[!0-9]*) echo "core count unavailable; leaving jobs capped" ;;
                       *) echo "CARGO_BUILD_JOBS=$n" >> "$GITHUB_ENV" ;; esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build binaries
        shell: bash
        env:
          # The five shipped binaries: the mapping TUI, the three no-map CLIs,
          # and the static map generator (SQ-1306).
          # Package names (SQ-1250): "app" -> "lanthorn" and every CLI ->
          # "lanthorn-<name>-cli" (the binaries keep their bare names, see below).
          #
          # `lanthorn-mapgen` needs no entry here: it is a second `[[bin]]` of
          # the `lanthorn` PACKAGE, and `-p` selects a package with all of its
          # binary targets. It does need naming in both loops below, which copy
          # binaries one at a time by name.
          BINS: "-p lanthorn -p lanthorn-zvm-cli -p lanthorn-gvm-cli -p lanthorn-scott-cli"
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "macos-universal2" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked $BINS --target aarch64-apple-darwin
            cargo build --release --locked $BINS --target x86_64-apple-darwin
            mkdir -p target/universal/release
            for bin in lanthorn lanthorn-mapgen zvm-cli gvm-cli scott-cli; do
              lipo -create -output "target/universal/release/$bin" \
                "target/aarch64-apple-darwin/release/$bin" \
                "target/x86_64-apple-darwin/release/$bin"
              # Ad-hoc re-sign: lipo can invalidate the per-slice signatures, and
              # Apple Silicon refuses to run a binary without a valid one. Not a
              # Developer-ID signature (still un-notarized), just enough to launch.
              codesign --force --sign - "target/universal/release/$bin"
            done
            lipo -info target/universal/release/lanthorn
            codesign --verify --verbose target/universal/release/lanthorn
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --locked $BINS --target ${{ matrix.target }}
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"          # v0.2.0 -> 0.2.0
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          NAME="lanthorn-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${NAME}"

          case "${{ matrix.name }}" in
            windows-x86_64)   RELDIR="target/${{ matrix.target }}/release"; EXT=".exe" ;;
            macos-universal2) RELDIR="target/universal/release";            EXT="" ;;
            *)                RELDIR="target/${{ matrix.target }}/release"; EXT="" ;;
          esac

          for bin in lanthorn lanthorn-mapgen zvm-cli gvm-cli scott-cli; do
            cp "${RELDIR}/${bin}${EXT}" "dist/${NAME}/"
          done
          cp README.md LICENSE "dist/${NAME}/"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}" >/dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release body is assembled here rather than inlined below so it can
      # carry the CHANGELOG section for this tag. Without it the published notes
      # were download instructions plus an auto-generated commit list — the
      # summary of what actually changed lived only in the annotated tag, where
      # nobody reading the release ever saw it.
      - name: Assemble the release notes
        run: |
          set -euo pipefail
          # The section runs from this tag's heading to the next one. Missing is
          # not fatal: a tag cut without a CHANGELOG entry still gets a release,
          # just without the summary.
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::warning::no CHANGELOG.md section found for $GITHUB_REF_NAME"
          fi
          # Drop the trailing blank lines and the rule that separates entries in
          # the file — they are file structure, not release content.
          while [ -s changelog-section.md ] && {
                  last=$(tail -n 1 changelog-section.md)
                  [ -z "$last" ] || [ "$last" = "---" ]
                }; do
            sed -i '$d' changelog-section.md
          done
          {
            printf '## lanthorn %s\n\n' "$GITHUB_REF_NAME"
            printf 'Download the archive for your platform, extract it, and run `lanthorn`\n'
            printf '(or one of the no-map CLI players `zvm-cli` / `gvm-cli` / `scott-cli`).\n\n'
            # The pre-release caveat belongs only on a pre-release. The tag decides
            # it here exactly as it decides the `prerelease:` flag below — a name
            # with a hyphen (v0.2.0-rc.1) is a pre-release, a bare vX.Y.Z is not
            # and carries no format note at all: the save-format policy is a
            # developer document, not release-body content.
            case "$GITHUB_REF_NAME" in
              *-*)
                printf '> **Pre-release** — across 0.x versions the on-disk save formats\n'
                printf '> may still break, never silently (see\n'
                printf '> `docs/release/save-format-policy.md`).\n\n'
                ;;
            esac
            if [ -s changelog-section.md ]; then
              sed 's/^## .*//' changelog-section.md
            else
              printf '> **No CHANGELOG section found for this tag.** Looked for a\n'
              printf '> heading matching `## %s` in CHANGELOG.md — add one and\n' "$GITHUB_REF_NAME"
              printf '> re-run, or edit this draft by hand before publishing.\n\n'
            fi
            printf '\n### Platform notes\n'
            printf -- '- **Linux** (`x86_64`, glibc, built on Ubuntu 22.04) requires\n'
            printf '  **`libasound2`** at runtime for audio —\n'
            printf '  `sudo apt-get install libasound2` (Debian/Ubuntu) or your distro'"'"'s\n'
            printf '  equivalent.\n'
            printf -- '- **macOS** is a universal binary (Apple Silicon + Intel), ad-hoc\n'
            printf '  signed but **not notarized** with an Apple Developer ID. If you\n'
            printf '  download it with a **browser**, Gatekeeper quarantines it — clear\n'
            printf '  the flag with `xattr -dr com.apple.quarantine <extracted-folder>`\n'
            printf '  (or approve it once in System Settings → Privacy & Security).\n'
            printf '  Downloading and extracting from the **Terminal** avoids quarantine\n'
            printf '  entirely: `curl -L <url> -o lanthorn.tar.gz && tar xzf lanthorn.tar.gz`.\n'
            printf -- '- **Windows** is `x86_64`. It is unsigned, so SmartScreen may warn on\n'
            printf '  first launch (More info → Run anyway).\n\n'
            printf 'Verify a download against its `.sha256` sidecar.\n'
          } > release-notes.md
          echo "--- assembled notes ---"
          cat release-notes.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: lanthorn ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: release-notes.md

  publish:
    name: Publish to crates.io
    needs: build
    # Full releases only — a hyphenated tag (v0.2.0-rc.1) is a pre-release and
    # crates.io has no such concept; publishing a pre-release version there
    # would need bumping Cargo.toml to a real pre-release identifier, which
    # this workflow does not do.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Same as the build job: give the runner its own core count rather than
      # the developer-Mac-sized cap in .cargo/config.toml.
      - name: Un-cap build jobs for the runner
        run: |
          n=$(nproc 2>/dev/null || true)
          case "$n" in ''|*[!0-9]*) : ;; *) echo "CARGO_BUILD_JOBS=$n" >> "$GITHUB_ENV" ;; esac

      # SQ-1250: cargo's own dependency-order publish (stable since well
      # before the 1.98 this repo pins). A missing token SKIPS rather than
      # fails — the very first publish is done by hand (see
      # docs/internals/releasing.md §6) because crates.io has no token to put
      # in this secret until an owner creates one, and every release before
      # that point should still succeed at building and shipping binaries.
      #
      # --no-verify, not a verify build: `lanthorn` (the app crate) currently
      # depends on this workspace's own [patch.crates-io] fork of
      # ratatui-image (see the root Cargo.toml's SQ-0972 comment) for
      # `Capability::KittyCompression` and `Picker::new_protocol_with_id`,
      # neither of which exists in the vanilla 11.0.6 on crates.io — a patch
      # is workspace-local and never travels with a published crate, so an
      # isolated verify build of `lanthorn` fails even though the workspace
      # itself builds cleanly. **`lanthorn` will publish a crate that fails
      # to build for every consumer until that patch is upstreamed and
      # removed** (the Cargo.toml comment already says "remove this once a
      # release carrying all of them exists") — do not tag a real release
      # while it is still in place without accepting that. Every other
      # workspace crate (the engines, buildinfo, cli-host, the three CLIs)
      # has no such blocker and verifies cleanly on its own.
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish for ${GITHUB_REF_NAME}. See docs/internals/releasing.md for the first, by-hand publish."
            exit 0
          fi
          cargo publish --workspace --no-verify
