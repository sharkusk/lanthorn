name: Docker

# Build the container image and push it to GitHub Container Registry on every
# version tag (the same trigger as release.yml, so a release and its image
# stay in step). Run manually (Actions -> Docker -> Run workflow) for a dry
# run: it builds the image WITHOUT pushing.
#
# The image itself, its two run modes, and the volumes it expects are
# documented in docs/internals/docker.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # fetch-tags so buildinfo's `git describe --exact-match` sees the tag
      # inside the build and stamps a clean version instead of `x.y.z (hash)`.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.2.0 -> 0.2.0 and 0.2; a pre-release tag (v0.2.0-rc.1) gets only its
      # own tag — `latest` is reserved for full releases, mirroring how
      # release.yml decides the prerelease flag by the hyphen.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lanthorn
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build (and push, on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
