# lanthorn's ALSA layout for the container (see crates/audio-relay/src/lib.rs).
#
# A container has no sound card. `default` is a plug over the `file` plugin:
# what a process plays is converted to S16_LE 44.1 kHz stereo and written,
# raw, to the path in LANTHORN_AUDIO_OUT. Unset, that path is /dev/null and
# the result is the old silent null device, opened cleanly and with no probe
# errors on exit. In serve mode the per-connection wrapper points it at the
# session's FIFO, whose reader is lanthorn-audio-relay.
pcm.lanthorn_capture {
  type file
  slave.pcm { type null }
  file {
    @func getenv
    vars [ LANTHORN_AUDIO_OUT ]
    default "/dev/null"
  }
  format "raw"
}
pcm.!default {
  type plug
  slave {
    pcm "lanthorn_capture"
    format S16_LE
    rate 44100
    channels 2
  }
}
ctl.!default {
  type null
}
